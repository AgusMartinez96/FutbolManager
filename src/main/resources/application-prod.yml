# Production overrides (SPRING_PROFILES_ACTIVE=prod on Render). Secrets come from the environment only.
server:
  # Behind Render's proxy: Tomcat's RemoteIpValve makes request.getRemoteAddr() the real client address.
  # It walks X-Forwarded-For from the right and only skips internal proxies, so a spoofed leftmost entry is ignored.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

fm:
  security:
    content-security-policy: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"

logging:
  structured:
    format:
      console: ecs
